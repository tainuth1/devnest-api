# Production overrides: multi-worker, no bind mount
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
    api:
        command:
            [
                "uvicorn",
                "app.main:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
                "--workers",
                "4",
                "--no-server-header",
            ]
        environment:
            DEBUG: "false"
