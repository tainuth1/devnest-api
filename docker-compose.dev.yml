# Local development: bind-mount source code + --reload flag
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
    api:
        command:
            [
                "uvicorn",
                "app.main:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
                "--reload",
            ]
        volumes:
            - .:/app
