version: 2
updates:
    # Maintain Python dependencies in requirements.txt
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "daily"
      open-pull-requests-limit: 10
      target-branch: "main"
      labels:
          - "security"
          - "dependencies"
      commit-message:
          prefix: "security(deps)"
          include: "scope"

    # Maintain Docker container base images
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "security"
          - "docker"
      commit-message:
          prefix: "security(docker)"

    # Maintain GitHub Actions workflows
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
          - "ci"
      commit-message:
          prefix: "ci(actions)"
